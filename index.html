<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>粒子球 · Three.js</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #04050a;
  }
  canvas { display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%);
    font: 12px/1.6 ui-sans-serif, system-ui, -apple-system,
          "PingFang SC", "Microsoft YaHei", sans-serif;
    color: rgba(180, 200, 255, .38);
    letter-spacing: .18em;
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="hint">移动鼠标 / 滑动屏幕</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. 基础环境
   ============================================================ */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, 0.1, 300
);
camera.position.set(0, 0, 6);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04050a, 1);
document.body.appendChild(renderer.domElement);

const isMobile = innerWidth < 768;

/* ============================================================
   2. 圆形粒子贴图（给背景星点用）
   ============================================================ */
function createDotTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(
    size / 2, size / 2, 0,
    size / 2, size / 2, size / 2
  );
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const dotTexture = createDotTexture();

/* ============================================================
   3. 粒子球数据（斐波那契球面分布 —— 保证均匀）
   ============================================================ */
const SPHERE_RADIUS = 2.0;
const COUNT = isMobile ? 9000 : 18000;

const positions = new Float32Array(COUNT * 3);
const colors    = new Float32Array(COUNT * 3);
const sizes     = new Float32Array(COUNT);
const phases    = new Float32Array(COUNT);

const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ≈ 2.39996
const tmpColor = new THREE.Color();

for (let i = 0; i < COUNT; i++) {
  // --- 均匀球面分布 ---
  const y = 1 - (i / (COUNT - 1)) * 2;          // 1 → -1
  const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = GOLDEN_ANGLE * i;

  const nx = Math.cos(theta) * radiusAtY;
  const nz = Math.sin(theta) * radiusAtY;

  // 轻微径向抖动，避免"过于规整"
  const jitter = 1 + (Math.random() - 0.5) * 0.04;
  const r = SPHERE_RADIUS * jitter;

  positions[i * 3 + 0] = nx * r;
  positions[i * 3 + 1] = y  * r;
  positions[i * 3 + 2] = nz * r;

  // --- 颜色：底部青蓝 → 顶部紫粉 ---
  const t = (y + 1) * 0.5;                       // 0(下) → 1(上)
  const hue = (0.52 + 0.30 * t) % 1;             // 青 → 蓝紫 → 品红
  const sat = 0.72 + 0.28 * Math.random();
  const lig = 0.46 + 0.14 * t + 0.18 * Math.random();

  tmpColor.setHSL(hue, Math.min(sat, 1), Math.min(lig, 0.86));
  colors[i * 3 + 0] = tmpColor.r;
  colors[i * 3 + 1] = tmpColor.g;
  colors[i * 3 + 2] = tmpColor.b;

  // --- 粒子大小 & 闪烁相位 ---
  sizes[i]  = 0.85 + Math.random() * 1.15;
  phases[i] = Math.random();
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('aColor',   new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));
geometry.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));

/* ============================================================
   4. 自定义着色器材质
   ============================================================ */
const uniforms = {
  uTime:       { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};

const vertexShader = /* glsl */`
  uniform float uTime;
  uniform float uPixelRatio;

  attribute vec3  aColor;
  attribute float aSize;
  attribute float aPhase;

  varying vec3  vColor;
  varying float vTwinkle;

  void main() {
    vColor = aColor;

    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

    // 每颗粒子独立的呼吸闪烁（相位随机）
    vTwinkle = 0.5 + 0.5 * sin(uTime * 1.8 + aPhase * 6.2831853);

    // 透视缩放：越远越小
    gl_PointSize = aSize * uPixelRatio * (10.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }
`;

const fragmentShader = /* glsl */`
  varying vec3  vColor;
  varying float vTwinkle;

  void main() {
    // 把方形点画成柔和圆形
    vec2 uv = gl_PointCoord - vec2(0.5);
    float d = length(uv);
    if (d > 0.5) discard;

    float alpha = smoothstep(0.5, 0.0, d);
    alpha *= alpha;                       // 边缘更柔

    vec3 col = vColor * (0.45 + 0.95 * vTwinkle);

    gl_FragColor = vec4(col, alpha);
  }
`;

const particleMaterial = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending
});

const points = new THREE.Points(geometry, particleMaterial);

/* ============================================================
   5. 背景星点（增加纵深感）
   ============================================================ */
const STAR_COUNT = isMobile ? 600 : 1400;
const starPos = new Float32Array(STAR_COUNT * 3);

for (let i = 0; i < STAR_COUNT; i++) {
  const r = 14 + Math.random() * 22;
  const u = Math.random() * 2 - 1;
  const phi = Math.random() * Math.PI * 2;
  const s = Math.sqrt(1 - u * u);

  starPos[i * 3 + 0] = r * s * Math.cos(phi);
  starPos[i * 3 + 1] = r * u;
  starPos[i * 3 + 2] = r * s * Math.sin(phi);
}

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  size: 0.42,
  map: dotTexture,
  color: 0x6f86d6,
  transparent: true,
  opacity: 0.75,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true
}));

/* ============================================================
   6. 组装场景
   ============================================================ */
const spinGroup = new THREE.Group();   // 自转
spinGroup.add(points);
spinGroup.rotation.x = 0.28;           // 轻微倾斜

scene.add(spinGroup);
scene.add(stars);

/* ============================================================
   7. 交互（鼠标 / 触摸）
   ============================================================ */
const pointer = { x: 0, y: 0 };
const smooth  = { x: 0, y: 0 };

function onPointerMove(clientX, clientY) {
  pointer.x = (clientX / innerWidth)  * 2 - 1;
  pointer.y = (clientY / innerHeight) * 2 - 1;
}

addEventListener('pointermove', (e) => onPointerMove(e.clientX, e.clientY));
addEventListener('touchmove', (e) => {
  if (e.touches[0]) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

/* ============================================================
   8. 动画循环
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;

  // 缓动跟随指针
  smooth.x += (pointer.x - smooth.x) * 0.045;
  smooth.y += (pointer.y - smooth.y) * 0.045;

  // 球体自转 + 呼吸缩放
  spinGroup.rotation.y = t * 0.18;
  const breath = 1 + Math.sin(t * 0.9) * 0.018;
  points.scale.setScalar(breath);

  // 相机视差
  camera.position.x = smooth.x * 0.55;
  camera.position.y = -smooth.y * 0.45;
  camera.position.z = 6 + Math.sin(t * 0.35) * 0.25;
  camera.lookAt(0, 0, 0);

  // 星空缓慢反向旋转
  stars.rotation.y = -t * 0.012;
  stars.rotation.x = smooth.y * 0.05;

  renderer.render(scene, camera);
}

/* ============================================================
   9. 自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixelRatio.value = renderer.getPixelRatio();
});

animate();
</script>
</body>
</html>
